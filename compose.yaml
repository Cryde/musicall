services:
    php-web:
        build: .docker/frankenphp
        container_name: php-web
        ports:
            - "80:80" # HTTP
            - "443:443" # HTTPS
            - "443:443/udp" # HTTP/3
        volumes:
            - .:/var/www/musicall
            - caddy_data:/data
            - caddy_config:/config
            - ./.docker/frankenphp/Caddyfile:/etc/frankenphp/Caddyfile
            - ./.docker/frankenphp/local/99-custom.ini:/usr/local/etc/php/conf.d/99-custom.ini
        environment:
            # we need localhost for google oauth...
            #
            # http://php-web:8080 is the address PHP publishes Mercure updates to. The scheme is
            # written out because that is what turns automatic HTTPS off for this address alone: an
            # explicit port only does that when the port is 80. Plain HTTP is the point, since the
            # image is built with skip_install_trust and so nothing inside the container trusts the
            # certificate Caddy issues itself.
            #
            # 8080 rather than 80 because 80 is published to the host, and there a request carrying
            # `Host: php-web` would be served the whole application in the clear instead of the
            # redirect to HTTPS every other host gets. 8080 is published nowhere, so this address
            # exists only on the docker network, which is also the only place the name resolves.
            SERVER_NAME: 'musicall.local, localhost, http://php-web:8080'
            # Read out of .env by compose and handed to Caddy, which reads it back in the Caddyfile's
            # mercure block. PHP inherits the same real environment variable and Symfony's Dotenv
            # never overrides one, so the hub and the application cannot end up signing with
            # different keys. An empty value makes Caddy refuse to start rather than silently reject
            # every subscription.
            MERCURE_JWT_SECRET: '${MERCURE_JWT_SECRET}'
        tty: true
        networks:
            musicall:
                ipv4_address: 10.200.200.7

    node:
        image: node:24-alpine3.24
        container_name: node
        command: /bin/true
        working_dir: /var/www/musicall
        volumes:
            - .:/var/www/musicall
        networks:
            - musicall

    php-cli:
        build: .docker/cli-musicall
        container_name: php-cli
        working_dir: /var/www/musicall
        command: /bin/true
        environment:
            # Same value, same source as php-web above, so app:mercure:ping signs with the key the
            # hub verifies with. Without it this container would fall back to .env plus .env.local,
            # and a secret put in .env.local (the natural place for one) would be a key Caddy has
            # never seen.
            MERCURE_JWT_SECRET: '${MERCURE_JWT_SECRET}'
        networks:
            - musicall
        volumes:
            - .:/var/www/musicall
            - ./.docker/cli-musicall/local/99-custom.ini:/usr/local/etc/php/conf.d/99-custom.ini

    db:
        image: mariadb:10.11
        container_name: musicall-db
        environment:
            MYSQL_ROOT_PASSWORD: toor
            MYSQL_DATABASE: musicall
        volumes:
            - db_files:/var/lib/mysql
            - ./volumes/db/logs:/var/log/mysql
        networks:
            musicall:
                ipv4_address: 10.200.200.6
                aliases:
                    - db.musicall

    elasticsearch:
        image: docker.elastic.co/elasticsearch/elasticsearch:7.17.18
        container_name: musicall-es
        mem_limit: 512mb
        environment:
            - discovery.type=single-node
            - "ES_JAVA_OPTS=-Xms256m -Xmx256m"
        ports:
            - 10.200.200.1:9200:9200
            - 10.200.200.1:9300:9300
        networks:
            musicall:
                ipv4_address: 10.200.200.8
                aliases:
                    - elasticsearch.musicall
        volumes:
            - es_files:/usr/share/elasticsearch/data

    valkey:
        image: valkey/valkey:8-alpine
        container_name: musicall-valkey
        command: valkey-server --save "" --appendonly no
        networks:
            musicall:
                ipv4_address: 10.200.200.9
                aliases:
                    - valkey.musicall

    # Headless Chromium as an HTTP service, rendering the setlist PDF export (#741). The
    # integration tests need it running; the rest of the suite substitutes the client.
    gotenberg:
        # Chromium only. The full image is about 1.7GB and what it adds is **LibreOffice**, needed
        # for Office conversion. It does not add the PDF engines: this variant already reports
        # `modules: api chromium exiftool pdfcpu pdfengines pdftk prometheus qpdf webhook`, so
        # /forms/pdfengines/merge works here, which is what the tech rider export relies on to fold a
        # PDF attachment into the document. An earlier version of this comment said otherwise.
        #
        # Pinned to a patch tag, matching CI, so an upstream change is a deliberate act. The pin in
        # config/packages/sensiolabs_gotenberg.yaml is the oldest version we rely on and is a
        # different number on purpose.
        image: gotenberg/gotenberg:8.34.0-chromium
        container_name: musicall-gotenberg
        environment:
            # Chromium renders whatever HTML it is handed, so it gets no way out. Assets are
            # uploaded alongside the HTML and read from its own working directory, so a render
            # needs no network at all: anything that does try to dial out is a template bug.
            CHROMIUM_DENY_PRIVATE_IPS: 'true'
            CHROMIUM_DENY_PUBLIC_IPS: 'true'
        ports:
            # Bound to the docker gateway rather than every interface, like elasticsearch above,
            # so it is reachable from this machine and from nowhere else.
            - 10.200.200.1:3000:3000
        networks:
            musicall:
                ipv4_address: 10.200.200.10
                aliases:
                    - gotenberg.musicall
networks:
    musicall:
        name: musicall
        ipam:
            driver: default
            config:
                -   subnet: 10.200.200.0/26

volumes:
    db_files:
        driver: local
    es_files:
        driver: local
    caddy_data:
    caddy_config:
