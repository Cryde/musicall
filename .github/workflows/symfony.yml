# https://help.github.com/en/actions
# from : https://www.strangebuzz.com/en/blog/setting-a-ci-cd-workflow-for-a-symfony-project-thanks-to-the-github-actions
name: MusicAll CI process
on:
    push:
        branches:
            - master
    pull_request:
        branches:
            - master
    workflow_dispatch:

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
    backend:
        name: Backend (PHP ${{ matrix.php-versions }})
        runs-on: ubuntu-24.04
        services:
            mysql:
                image: mariadb:10.11
                env:
                    MYSQL_ROOT_PASSWORD: toor
                ports:
                    - 3306:3306
                options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3

            # Renders the setlist PDF export. Most tests substitute the client and need nothing
            # running, but two of them read the embedded font table and the real page count out of
            # Chromium's output, which no fake can produce. They fail rather than skip here on
            # purpose, so a broken renderer cannot pass as a green run.
            #
            # The chromium-only variant: the full image is about 1.7GB and its LibreOffice and PDF
            # engines are only needed for Office conversion and PDF/A. Pinned to a patch tag so an
            # upstream change is never a surprise.
            #
            # No --health-cmd: that runs inside the container and this image ships no shell tooling
            # to probe itself with, so the wait happens from the runner below.
            gotenberg:
                image: gotenberg/gotenberg:8.34.0-chromium
                ports:
                    - 3000:3000

        strategy:
            fail-fast: true
            matrix:
                php-versions: ['8.4']
        steps:
            # —— Setup ——————————————————————————————————————————————————————————————
            - name: Checkout
              uses: actions/checkout@v4

            - name: Setup PHP, extensions and composer
              uses: shivammathur/setup-php@v2
              with:
                  php-version: ${{ matrix.php-versions }}
                  extensions: mbstring, ctype, intl, pdo_mysql, gd, xml
                  coverage: pcov

            # —— Composer ——————————————————————————————————————————————————————————
            - name: Get Composer Cache Directory
              id: composer-cache
              run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

            - uses: actions/cache@v4
              with:
                  path: ${{ steps.composer-cache.outputs.dir }}
                  key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
                  restore-keys: ${{ runner.os }}-composer-

            - name: Install dependencies
              run: composer install --no-progress --prefer-dist --optimize-autoloader

            # —— Symfony ———————————————————————————————————————————————————————————
            - name: Check the Symfony console
              run: bin/console about

            # —— Static analysis ———————————————————————————————————————————————————
            - name: Static Analysis using PHPStan
              run: vendor/bin/phpstan analyse --no-progress --memory-limit=600M

            # —— Test database —————————————————————————————————————————————————————
            - name: Create test database
              env:
                  APP_ENV: test
              run: |
                  bin/console -n doctrine:database:create --if-not-exists
                  bin/console -n doctrine:schema:create
                  bin/console -n doctrine:schema:validate

            # —— Tests —————————————————————————————————————————————————————————————
            - name: Wait for Gotenberg
              run: |
                  for i in $(seq 1 30); do
                      if curl -fsS http://localhost:3000/health > /dev/null; then
                          echo "Gotenberg is up after ${i}s"
                          exit 0
                      fi
                      sleep 1
                  done
                  echo "Gotenberg did not become healthy within 30s"
                  exit 1

            - name: Run tests and collect coverage
              env:
                  APP_ENV: test
                  # .env points this at the docker-compose alias, which does not resolve here.
                  GOTENBERG_DSN: http://localhost:3000
              run: vendor/bin/phpunit --coverage-clover ./coverage.xml

            - name: Upload coverage reports to Codecov
              uses: codecov/codecov-action@v5
              with:
                  token: ${{ secrets.CODECOV_TOKEN }}

    frontend:
        name: Frontend (Node ${{ matrix.node-versions }})
        runs-on: ubuntu-24.04
        strategy:
            fail-fast: true
            matrix:
                node-versions: ['22']
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Setup Node
              uses: actions/setup-node@v4
              with:
                  node-version: ${{ matrix.node-versions }}
                  cache: 'npm'

            - name: Install dependencies
              run: npm ci

            - name: Lint (Biome)
              run: npm run lint

            # Node's own test runner, so there is no framework to install. It covers the pure helpers
            # that carry logic worth pinning; anything needing a DOM is still untested.
            - name: Test (node --test)
              run: npm test

            - name: Build (Vite)
              run: npm run build
