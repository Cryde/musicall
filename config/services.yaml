# yaml-language-server: $schema=../vendor/symfony/dependency-injection/Loader/schema/services.schema.json

# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.
# See also https://symfony.com/doc/current/service_container/import.html

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:
    locale: 'fr'
    # Grace period for an archived Band Space file: how long the trash keeps it before
    # app:band-space:purge destroys the object and the rows. Shared so the countdown shown to members
    # and the purge condition are derived from one value and cannot drift apart.
    band_space.file_retention_days: 30
    file_publication_cover_destination: 'images/publication/cover'
    file_user_profile_picture_destination: 'images/user/profile'
    file_musician_media_thumbnail_destination: 'images/musician/media'

    # Kill switch for the auth instrumentation (#1021), so it can be stopped without a deploy.
    #
    # Defaults ON, and that is the load-bearing part: Deployer shares `.env` *and* `.env.local`, so a
    # variable added to the committed `.env` never reaches production. A default-off flag would ship
    # dead and nobody would notice, because the symptom is an absence of logs. Set
    # AUTH_OBSERVABILITY_ENABLED=0 in the server's shared `.env` to turn it off. Note the `default`
    # processor treats an empty value as unset, so `=0` is the way to disable it, not `=`.
    app.auth_observability.default: true
    app.auth_observability.enabled: '%env(bool:default:app.auth_observability.default:AUTH_OBSERVABILITY_ENABLED)%'

services:
    # default configuration for services in *this* file
    _defaults:
        autowire: true      # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.

    _instanceof:
        App\Service\Bot\BotMetaDataProviderInterface:
            tags: ['app.bot_metadata_provider']
        App\Service\Musician\MediaMetadata\MediaMetadataFetcherInterface:
            tags: ['app.media_metadata_fetcher']
        App\Service\Musician\MediaUrlParser\MediaUrlParserInterface:
            tags: ['app.media_url_parser']
        App\Service\Notification\Enricher\NotificationEnricherInterface:
            tags: ['app.notification_enricher']

    # makes classes in src/ available to be used as services
    # this creates a service per class whose id is the fully-qualified class name
    App\:
        resource: '../src/'
        exclude:
            - '../src/Entity/'
    # add more service definitions when explicit configuration is needed
    # please note that last definitions always *replace* previous ones

    App\EventListener\AuthenticationSuccessListener:
        tags:
            - { name: kernel.event_listener, event: lexik_jwt_authentication.on_authentication_success, method: onAuthenticationSuccessResponse }

    App\Service\Identifier\RequestIdentifier:
        arguments:
            $secret: '%env(IDENTIFIER_SECRET)%'

    # No $release argument: the SDK already stamps `sentry.release` on every log from the same env
    # var, so a second one here would be one value under two names (#1029).
    App\Security\Observability\AuthContextBuilder:
        arguments:
            $tokenParameterName: '%gesdinet_jwt_refresh_token.token_parameter_name%'

    App\Service\Mail\Brevo\Contact\ContactUsEmail:
        arguments:
            $email:  '%env(MAIL_CONTACT_EMAIL)%'

    App\Service\DirectoryNamer\StaticDirectoryNamer:
        public: true # mandatory for vich bundle

    musicall.s3_client:
        class: Aws\S3\S3Client
        arguments:
            -
                version: '2006-03-01'
                region: "fr-par"
                endpoint: "https://s3.fr-par.scw.cloud"
                credentials:
                    key: "%env(SCALEWAY_KEY)%"
                    secret: "%env(SCALEWAY_SECRET)%"

    Google\Service\YouTube:
        factory: '@App\Service\Google\YoutubeFactory'

    App\Contracts\Google\Youtube\YoutubeRepositoryInterface: '@App\Service\Google\YoutubeRepository'

    App\Command\User\SendEmailConfirmationReminderCommand:
        arguments:
            $frontendUrl: '%env(DEFAULT_URI)%'

    App\Security\AuthenticationFailureHandler:
        tags:
            - { name: kernel.event_listener, event: lexik_jwt_authentication.on_authentication_failure, method: onAuthenticationFailure }

    # The native half of #1016: a session issued into the response body instead of into cookies.
    #
    # With no cookie providers, JWTAuthenticationSuccessResponse takes its `!$jwtCookies` branch and
    # seeds the body with the token, and the strip in handleAuthenticationSuccess() never fires. So
    # the JWT is not split for a native client and the body is never empty, which is also why this
    # cannot come back 204. The flag is redundant for that reason and passed anyway, because it
    # states what this service is for. The refresh token and the Mercure subscriber token are still
    # attached as cookies at this point; NativeCredentialsInBodyListener moves them.
    app.security.native.authentication_success_handler:
        class: Lexik\Bundle\JWTAuthenticationBundle\Security\Http\Authentication\AuthenticationSuccessHandler
        arguments:
            $jwtManager: '@lexik_jwt_authentication.jwt_manager'
            $dispatcher: '@event_dispatcher'
            $cookieProviders: []
            $removeTokenFromBodyWhenCookiesUsed: false

    # gesdinet's wrapper around that one, and it is not optional.
    # RefreshTokenAuthenticatorFactory::createAuthenticationSuccessHandler() only builds it when the
    # firewall names no success_handler of its own, so pointing native_api_token_refresh straight at
    # the handler above would stop RefreshEvent / gesdinet.refresh_token being dispatched. Nothing
    # listens to it today, which is precisely why the omission would stay silent until
    # block_previous_jwt or reuse_detection is turned on.
    app.security.native.refresh_success_handler:
        class: Gesdinet\JWTRefreshTokenBundle\Security\Http\Authentication\AuthenticationSuccessHandler
        arguments:
            $lexikAuthenticationSuccessHandler: '@app.security.native.authentication_success_handler'
            $eventDispatcher: '@event_dispatcher'
        calls:
            - setFirewallName: ['native_api_token_refresh']

    App\Controller\OAuth\GoogleController:
        arguments:
            $frontendUrl: '%env(DEFAULT_URI)%'
            $refreshTokenTtl: '%gesdinet_jwt_refresh_token.ttl%'

when@test:
    services:
        App\Contracts\Google\Youtube\YoutubeRepositoryInterface: '@App\Service\Google\DummyYoutubeRepository'

        # NotificationCreator publishes a Mercure signal on every notification and fifteen source
        # files call it, so without this a large part of the suite would attempt an HTTP POST to a
        # host that deliberately does not resolve. Replaced rather than decorated: there is no real
        # hub behind it to pass through to, and nothing in the suite should ever reach one.
        #
        # Public so a test can fetch it and assert on what was published.
        App\Tests\Double\RecordingHub:
            public: true

        # Only the interface, which is what publishers inject. Not mercure.hub.default itself: that
        # one is also what Authorization reads the token factory and public URL from, so replacing it
        # would stop the subscriber cookie being minted and take the #949 tests with it.
        #
        # All three forms of HubInterface, because MercureBundle registers named-argument aliases and
        # those win over the bare interface. A publisher written as `HubInterface $defaultHub` would
        # otherwise get the real hub here and POST to a host that does not resolve. The deprecated
        # PublisherInterface aliases and HubRegistry still point at the real hub; nothing uses them to
        # publish, and .env.test's unresolvable MERCURE_URL is the backstop if something ever does.
        Symfony\Component\Mercure\HubInterface: '@App\Tests\Double\RecordingHub'
        Symfony\Component\Mercure\HubInterface $default: '@App\Tests\Double\RecordingHub'
        Symfony\Component\Mercure\HubInterface $defaultHub: '@App\Tests\Double\RecordingHub'

        # The suite renders PDFs without a Gotenberg container. Substituting the client rather than
        # the renderer keeps the real builder, the real Twig render and the real fit arithmetic under
        # test, and lets a test assert on what was actually sent.
        #
        # Decorating rather than replacing, so the real client stays reachable: an integration test
        # calls passthrough() to render against a live Gotenberg through the very same wiring.
        #
        # Public so a test can fetch it to seed a content height or force a failure; the builders
        # resolve this id lazily through a service subscriber, so decorating it is enough.
        App\Tests\Double\RecordingGotenbergClient:
            public: true
            decorates: 'sensiolabs_gotenberg.client'
            arguments:
                $inner: '@.inner'

        # Don't fire UserActivityListener on every test request - it would
        # write to fos_user.last_activity_datetime ~1600 times per suite.
        # The listener's own behavior is covered directly by
        # UserActivityListenerTest (direct invocation, no HTTP).
        App\EventSubscriber\UserActivityListener:
            autoconfigure: false
