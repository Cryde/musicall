framework:
    rate_limiter:
        contact_form:
            policy: sliding_window
            limit: 3
            interval: '1 hour'
            cache_pool: "rate_limiter.cache"
        musician_search:
            policy: sliding_window
            limit: 10
            interval: '20 minutes'
            cache_pool: "rate_limiter.cache"
        # The guided search's « would a wider search find something » (#1084): public, one or two
        # distance queries a call, and asked only after a search that found nothing.
        musician_search_widen:
            policy: sliding_window
            limit: 60
            interval: '10 minutes'
            cache_pool: "rate_limiter.cache"
        # Recording musician searches (#1075), not the searches themselves: past it a search still answers.
        search_log:
            policy: sliding_window
            limit: 60
            interval: '1 hour'
            cache_pool: "rate_limiter.cache"
        # « Relancer » on one date of an agenda entry (#1000), keyed by entry and date: a push to the whole
        # band, so once every twelve hours at most.
        agenda_availability_reminder:
            policy: fixed_window
            limit: 1
            interval: '12 hours'
            cache_pool: "rate_limiter.cache"
        # The city pickers' suggestions: one call a pause in typing, so a few per field filled in.
        geocoding:
            policy: sliding_window
            limit: 120
            interval: '10 minutes'
            cache_pool: "rate_limiter.cache"
        registration:
            policy: fixed_window
            limit: 3
            interval: '1 hour'
            cache_pool: "rate_limiter.cache"
        # Google sign-in from the app, per IP (#1133). Each attempt checks a token against Google, and
        # a person signs in a handful of times at most.
        native_oauth:
            policy: sliding_window
            limit: 10
            interval: '10 minutes'
            cache_pool: "rate_limiter.cache"
        # Every registration attempt, refused ones included, since a refusal says whether an email
        # already has an account (#1119). Generous enough for someone fixing typos.
        registration_attempt:
            policy: sliding_window
            limit: 20
            interval: '1 hour'
            cache_pool: "rate_limiter.cache"
        message_send:
            policy: fixed_window
            limit: 20
            interval: '1 minute'
            cache_pool: "rate_limiter.cache"
        # A typing signal (#1040): the client sends one every 3 seconds at most while a member types,
        # so 20 a minute is continuous typing. Double that leaves room for two tabs and stops a script.
        chat_typing:
            policy: fixed_window
            limit: 40
            interval: '1 minute'
            cache_pool: "rate_limiter.cache"
        # Presence (#1040): a heartbeat every 30 seconds, plus one per arrival or departure of a
        # bandmate. 20 a minute covers a busy band with room to spare.
        chat_presence:
            policy: fixed_window
            limit: 20
            interval: '1 minute'
            cache_pool: "rate_limiter.cache"
        thread_creation:
            policy: fixed_window
            limit: 5
            interval: '1 minute'
            cache_pool: "rate_limiter.cache"
        comment_post:
            policy: fixed_window
            limit: 5
            interval: '2 minutes'
            cache_pool: "rate_limiter.cache"
        forum_topic_creation:
            policy: fixed_window
            limit: 1
            interval: '5 minutes'
            cache_pool: "rate_limiter.cache"
        forum_reply:
            policy: fixed_window
            limit: 1
            interval: '30 seconds'
            cache_pool: "rate_limiter.cache"
        musician_announce:
            policy: fixed_window
            limit: 1
            interval: '5 minutes'
            cache_pool: "rate_limiter.cache"
        musician_announce_daily:
            policy: fixed_window
            limit: 5
            interval: '1 day'
            cache_pool: "rate_limiter.cache"
        email_verification_check:
            # Higher than password_reset (4): OTP entry is error-prone (mistyped 6-digit code).
            policy: fixed_window
            limit: 10
            interval: '1 hour'
            cache_pool: "rate_limiter.cache"
        email_verification_send:
            # Bounds cross-account enumeration probing; the per-user 60s cooldown already caps emails per account.
            policy: fixed_window
            limit: 10
            interval: '1 hour'
            cache_pool: "rate_limiter.cache"
        password_reset:
            policy: fixed_window
            limit: 4
            interval: '1 hour'
            cache_pool: "rate_limiter.cache"
        band_space_invitation:
            policy: fixed_window
            limit: 10
            interval: '1 hour'
            cache_pool: "rate_limiter.cache"
        band_space_file_share_create:
            policy: sliding_window
            limit: 10
            interval: '5 minutes'
            cache_pool: "rate_limiter.cache"
        band_space_file_share_access:
            policy: sliding_window
            limit: 60
            interval: '1 minute'
            cache_pool: "rate_limiter.cache"
        # Mirrored by hand in assets/js/utils/fileUploadQueue.js as UPLOAD_RATE_LIMIT and
        # UPLOAD_RATE_WINDOW_MS: the Files import dialog paces a batch against these numbers so it
        # does not walk into a 429 at file thirty one. Nothing checks the two agree, because a JS
        # test cannot read this file. Changing limit or interval here means changing them there too.
        band_space_file_upload:
            policy: sliding_window
            limit: 30
            interval: '1 minute'
            cache_pool: "rate_limiter.cache"
        # Keyed on the token, not on the caller's address: a calendar client polls from its vendor's
        # shared fetcher pool, so a per IP bucket would let one band's subscribers throttle another's.
        # 60 an hour against the most aggressive legitimate configuration there is, Apple Calendar at
        # its 5 minute minimum, which is 12. Google and Outlook are hours apart, so nobody real gets
        # close. A 429 here is invisible to the user: the client shows nothing and quietly stops
        # refreshing, which is why the ceiling sits this far above real use.
        band_space_agenda_feed_access:
            policy: sliding_window
            limit: 60
            interval: '1 hour'
            cache_pool: "rate_limiter.cache"
        # Charged only when the token is unknown, and keyed on the address, which is what stops
        # someone minting a Valkey bucket per token they invent. A real subscriber never reaches it.
        band_space_agenda_feed_miss:
            policy: sliding_window
            limit: 20
            interval: '1 hour'
            cache_pool: "rate_limiter.cache"
        band_space_creation:
            policy: fixed_window
            limit: 2
            interval: '1 day'
            cache_pool: "rate_limiter.cache"
        # Higher than contact_form (3/hour): feedback is meant to be sent the moment something
        # is noticed, so a user filing three small reports while walking through a module is normal
        # use rather than abuse.
        feedback_submit:
            policy: sliding_window
            limit: 5
            interval: '1 hour'
            cache_pool: "rate_limiter.cache"
        # Reporting content (#1116): a handful an hour is plenty for real use, and every attempt counts
        # since a 404 also says whether something exists.
        report_create:
            policy: sliding_window
            limit: 10
            interval: '1 hour'
            cache_pool: "rate_limiter.cache"
        # The mobile app registers its push token on every launch and after each sign in, so a
        # handful an hour is normal; past that something is looping.
        device_token_register:
            policy: sliding_window
            limit: 20
            interval: '1 hour'
            cache_pool: "rate_limiter.cache"
        # Blocking and unblocking (#1117), shared by both: a person toggling a block back and forth
        # has no use for more than this.
        user_block:
            policy: sliding_window
            limit: 30
            interval: '1 hour'
            cache_pool: "rate_limiter.cache"
