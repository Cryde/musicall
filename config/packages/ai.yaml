services:
    # OpenAI Platform. symfony/ai 0.8 renamed PlatformFactory to Factory and moved
    # $eventDispatcher from position 3 to 6, and the signature has since grown
    # $modelRouter in 0.12. Named arguments keep this binding correct whatever gets
    # inserted next, so do not switch these back to positional.
    Symfony\AI\Platform\PlatformInterface:
        factory: ['Symfony\AI\Platform\Bridge\OpenAi\Factory', 'createPlatform']
        arguments:
            $apiKey: '%env(OPEN_AI_KEY)%'
            $httpClient: '@http_client'
            $eventDispatcher: '@event_dispatcher'

    # Musician Filter Agent
    app.ai.agent.musician_filter:
        class: Symfony\AI\Agent\Agent
        arguments:
            $platform: '@Symfony\AI\Platform\PlatformInterface'
            # Do not add a temperature here: the GPT-5 generation rejects it with a 400, only the
            # default is accepted. Query string options on this model name are forwarded to the API
            # verbatim, so a leftover ?temperature=0.5 breaks the endpoint at runtime.
            $model: 'gpt-5.6-terra'
            $inputProcessors: []
            $outputProcessors: []
            $name: 'musician_filter'

    # Structured Output Event Subscriber
    Symfony\AI\Platform\StructuredOutput\PlatformSubscriber:
        tags:
            - { name: kernel.event_subscriber }
