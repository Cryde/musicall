security:
    # https://symfony.com/doc/current/security.html#registering-the-user-hashing-passwords
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

    # https://symfony.com/doc/current/security.html#loading-the-user-the-user-provider
    providers:
        # used to reload user from session & other features (e.g. switch_user)
        app_user_provider:
            entity:
                class: App\Entity\User

    # ROLE_TESTER is deliberately absent: it is a feature flag, not a rank. It reveals modules that
    # are merged but not yet announced, grants no permission of its own, and is held by ordinary
    # users, so putting it here would make every tester an admin (which is what ROLE_SUPER_ADMIN
    # used to do, see #942).
    role_hierarchy:
        ROLE_ADMIN: ROLE_USER

    firewalls:
        dev:
            pattern: ^/(_(profiler|wdt)|css|images|js|assets|build)/
            security: false

        api_token_refresh:
            pattern:  ^/api/token/refresh
            stateless: true
            user_checker: App\Security\UserChecker
            refresh_jwt:
                check_path: /api/token/refresh

        login:
            pattern: ^/api/login
            stateless: true
            user_checker: App\Security\UserChecker
            json_login:
                check_path: /api/login_check
                success_handler: lexik_jwt_authentication.handler.authentication_success
                failure_handler: lexik_jwt_authentication.handler.authentication_failure
            login_throttling:
                cache_pool: 'rate_limiter.cache'

        # The native pair (#1016). Same credentials, same user checker, same failure handler as the
        # web above; all that differs is that the session comes back in the response body and no
        # cookie is set, which is the only thing a native client cannot emulate without a cookie jar.
        #
        # Everything under App\Security\Native\NativeSurface::PREFIX is blinded to cookies before the
        # firewall runs. That is what makes a second issuing surface safe rather than a second way
        # for an injected script to turn the browser's httpOnly refresh token into a complete JWT.
        # Read BlindNativeSurfaceToCookiesListener before adding anything here.
        native_login:
            pattern: ^/api/native/login
            stateless: true
            user_checker: App\Security\UserChecker
            json_login:
                check_path: /api/native/login_check
                success_handler: app.security.native.authentication_success_handler
                failure_handler: lexik_jwt_authentication.handler.authentication_failure
            # The web firewall's own bucket, deliberately shared. LoginThrottlingFactory puts the
            # firewall name in the limiter id, so throttling configured here would be a second,
            # independent password-guessing budget against the same account and double the rate an
            # attacker gets by alternating the two endpoints.
            login_throttling:
                limiter: security.login_throttling.login.limiter

        # Separate from native_login rather than one firewall over ^/api/native/, for the reason
        # api_token_refresh is separate from login: LoginThrottlingListener charges any passport
        # carrying a UserBadge, and gesdinet's authenticator produces one, so a combined firewall
        # would spend the login allowance on every token refresh.
        native_api_token_refresh:
            pattern: ^/api/native/token/refresh
            stateless: true
            user_checker: App\Security\UserChecker
            refresh_jwt:
                check_path: /api/native/token/refresh
                success_handler: app.security.native.refresh_success_handler

        api:
            pattern: ^/api/
            lazy: true
            entry_point: jwt
            stateless: true
            provider: app_user_provider
            jwt: ~
            refresh_jwt:
                check_path: /api/token/refresh
            logout:
                path: api_token_invalidate
                delete_cookies:
                    jwt_hp: null
                    jwt_s: null
                    # Scoped to the hub's own path, so clearing it needs that path spelled out: a
                    # path-less clearing cookie would leave a logged-out browser able to keep
                    # reading its previous account's Mercure topic until the token expired, which
                    # matters on a shared machine. clear_site_data below would also do it, but
                    # Safari does not implement it.
                    mercureAuthorization: { path: /.well-known/mercure }
                clear_site_data:
                    - cookies
                    - storage

    # Easy way to control access for large sections of your site
    # Note: Only the *first* access control that matches will be used
    access_control:
        - { path: ^/login$, role: IS_AUTHENTICATED_ANONYMOUSLY }
        - { path: ^/register, role: IS_AUTHENTICATED_ANONYMOUSLY }
        - { path: ^/oauth/, role: PUBLIC_ACCESS }
        - { path: ^/api/admin, role: ROLE_ADMIN }
        - { path: ^/api/users/request-reset-password, role: PUBLIC_ACCESS }
        - { path: ^/api/login_check, roles: IS_AUTHENTICATED_ANONYMOUSLY }
        - { path: ^/api/token/refresh, roles: PUBLIC_ACCESS }
        - { path: ^/api/native/login_check, roles: PUBLIC_ACCESS }
        - { path: ^/api/native/token/refresh, roles: PUBLIC_ACCESS }
        - { path: ^/api/shares/, role: PUBLIC_ACCESS }

when@test:
    security:
        password_hashers:
            # Password hashers are resource-intensive by design to ensure security.
            # In tests, it's safe to reduce their cost to improve performance.
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4 # Lowest possible value for bcrypt
                time_cost: 3 # Lowest possible value for argon
                memory_cost: 10 # Lowest possible value for argon
