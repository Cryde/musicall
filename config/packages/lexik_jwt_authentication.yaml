lexik_jwt_authentication:
    secret_key: '%env(resolve:JWT_SECRET_KEY)%'
    public_key: '%env(resolve:JWT_PUBLIC_KEY)%'
    pass_phrase: '%env(JWT_PASSPHRASE)%'
    token_ttl:    3600 # one hour
    set_cookies:
        jwt_hp:
            lifetime: null
            samesite: strict
            path: /
            domain: null
            httpOnly: false
            partitioned: false
            split:
                - header
                - payload

        jwt_s:
            lifetime: 0
            samesite: strict
            path: /
            domain: null
            httpOnly: true
            partitioned: false
            split:
                - signature
    # Both are on, and that is safe because accepting a credential is not issuing one.
    # ChainTokenExtractor::extract() returns the first extractor that yields a token, and
    # LexikJWTAuthenticationExtension::createTokenExtractors() builds the map header-first, so a
    # browser request still authenticates from its cookies and only a caller that already holds a
    # complete JWT can use the header. The web can never be that caller: the split exists so script
    # never holds more than header.payload, and jwt_s stays out of its reach. Issuing is the half
    # that cannot be shared, which is what the native firewalls in security.yaml are for.
    token_extractors:
        split_cookie:
            enabled: true
            cookies:
                - jwt_hp
                - jwt_s
        authorization_header:
            enabled: true
    blocklist_token:
        enabled: true
        cache: cache.app
