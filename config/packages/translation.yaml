parameters:
    # A parameter rather than a list under framework, so an environment can override it: config merging appends lists.
    app.enabled_locales: [fr, en]

framework:
    default_locale: fr
    enabled_locales: '%app.enabled_locales%'
    translator:
        default_path: '%kernel.project_dir%/translations'
        fallbacks:
            - fr
        providers:
