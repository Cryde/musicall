# Spike for #741: evaluating Gotenberg (headless Chromium over HTTP) against dompdf.
# Exercised by app:pdf:gotenberg-probe. Delete this file, the bundles.php entry, the compose
# service, the GOTENBERG_DSN variable and the command together if the answer is no.
#
# The scoped client lives here rather than in http_clients.yaml so the whole spike is one file,
# which is also how the bundle documents it.
framework:
    http_client:
        scoped_clients:
            gotenberg.client:
                base_uri: '%env(GOTENBERG_DSN)%'

sensiolabs_gotenberg:
    http_client: 'gotenberg.client'
