# Push notification text (#1110, #1191), ICU syntax. Rendered in the recipient's locale, never the request's.
# Each notification sentence mirrors AppNotification.preview in the mobile app (Cryde/musicall-app).
title:
    default: "MusicAll"

notification:
    band_space_invitation: "{actor} vous a invité à rejoindre {band}"
    band_space_invitation_accepted: "{actor} a accepté votre invitation à {band}"
    band_space_invitation_declined: "{actor} a décliné votre invitation à {band}"
    band_space_task_assignment: "{actor} vous a assigné à la tâche « {task} »"
    task_mention: "{actor} vous a mentionné dans la tâche « {task} »"
    band_space_chat_mention: "{actor} vous a mentionné dans la discussion de « {band} »"
    task_comment: "{actor} a commenté la tâche « {task} »"
    band_space_agenda_entry_created: "{actor} a ajouté l'événement « {event} »"
    band_space_agenda_availability_requested: "{actor} demande vos disponibilités pour « {event} »"
    band_space_finance_split_assigned: "{actor} vous a attribué une dépense sur « {expense} »"
    band_space_role_changed:
        promoted: "{actor} vous a nommé administrateur de « {band} »"
        demoted: "{actor} vous a retiré les droits d'administrateur sur « {band} »"
    band_space_member_removed: "{actor} vous a retiré de « {band} »"
    band_space_member_left: "{actor} a quitté « {band} »"
    band_space_deletion_scheduled: "{actor} a programmé la suppression de « {band} »"
    band_space_deletion_cancelled: "{actor} a annulé la suppression de « {band} »"
    forum_topic_reply: "{actor} a répondu à votre sujet sur le forum"
    publication_comment: "{actor} a commenté votre publication"
    comment_reply: "{actor} a répondu à votre commentaire"
    publication_approved: "{actor} a publié votre article"
    publication_rejected: "{actor} a refusé votre article"
    gallery_approved: "{actor} a publié votre galerie"
    gallery_rejected: "{actor} a refusé votre galerie"
    report: "{actor} a une nouvelle notification pour vous"

message:
    attachment_only: "Pièce jointe"
    band_channel_body: "{author} : {preview}"
